<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let randomno=Math.floor(Math.random()*100)+1;
        let userscore="75";
        let score=Number(userscore);
        let diff=randomno-score
        let roudaqrt=Math.round(Math.sqrt(score));
        let pi=Math.PI;
        let convert="50"*2

        document.write("random number :"+randomno+"<br>")
        document.write("user score :"+userscore+"<br>")
        document.write("score :"+score+"<br>")
        document.write("difference :"+diff+"<br>")
        document.write("rounded sqrt :"+roudaqrt+"<br>")
        document.write("pi :"+pi+"<br>")
        document.write("implicit conversion resul:"+convert+"<br>")
    </script>
</body>
</html>
