<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let tshirt=5;
        let cap=3;
        let tshirtprice=400;
        let capprice=150;
        let totalearning=(tshirt*tshirtprice)+(cap*capprice)
        document.write( "total earning="+totalearning +"<br>")
        tshirtprice=450;
        let totalearningre=(tshirt*tshirtprice)+(cap*capprice)
        document.writeln( "recalulated earning="+totalearningre)
    </script>
</body>
</html>
