<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">user comment system </h1>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <script>
        let comment="My son is 12 years old. Our flat number is 45 and contact is 9876543210.";
        document.getElementById("demo").innerHTML = comment;
        let numpresent=/\d/g.test(comment);
        document.getElementById("demo1").innerHTML="whether number is present in the comment or not: "+numpresent;
        let replace=comment.replace(/\d+/g,"NUMBER");
        document.getElementById("demo2").innerHTML="replaced comment="+replace
    </script>
       
</body>
</html>
