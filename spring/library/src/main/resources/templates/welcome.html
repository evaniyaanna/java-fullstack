<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 600px;
            margin: 120px auto;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            color: #555;
        }

        .library-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="library-icon">
        📚
    </div>

    <h1>
        Welcome,
        <span th:text="${name}"></span>!
    </h1>

    <p>
        Your library membership has been created.
    </p>

</div>

</body>

</html>
