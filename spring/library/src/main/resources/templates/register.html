<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Library Membership</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Library Membership</h1>

    <!-- Error message -->
    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/registration}"
          th:object="${member}"
          method="post">

        <!-- Name -->
        <label for="name">
            Name
        </label>

        <input type="text"
               id="name"
               th:field="*{name}"
               placeholder="Enter your name"
               required>

        <!-- Date of Birth -->
        <label for="dateOfBirth">
            Date of Birth
        </label>

        <input type="date"
               id="dateOfBirth"
               th:field="*{dateOfBirth}"
               required>

        <!-- Address -->
        <label for="address">
            Address
        </label>

        <textarea id="address"
                  th:field="*{address}"
                  placeholder="Enter your address"
                  required></textarea>

        <!-- Email -->
        <label for="email">
            Email
        </label>

        <input type="email"
               id="email"
               th:field="*{email}"
               placeholder="Enter your email"
               required>

        <!-- Password -->
        <label for="password">
            Password
        </label>

        <input type="password"
               id="password"
               th:field="*{password}"
               placeholder="Enter your password"
               required>

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>

</html>
