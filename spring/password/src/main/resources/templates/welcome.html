<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            height: 65px;
            background: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            color: white;
            text-decoration: none;
            background: #dc3545;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .logout:hover {
            background: #b02a37;
        }

        .content {
            width: 600px;
            margin: 100px auto;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .content h1 {
            margin-bottom: 20px;
        }

        .content p {
            font-size: 18px;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>Welcome Portal</h2>

    <form th:action="@{/logout}"
          method="post">

        <button type="submit"
                class="logout">
            Logout
        </button>

    </form>

</div>


<div class="content">

    <h1>
        Welcome!
    </h1>

    <p>
        Hello,
        <strong th:text="${email}"></strong>
    </p>

    <p>
        You have successfully logged in.
    </p>

</div>

</body>

</html>
