<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }

        .password-error {
            color: red;
            margin-top: 5px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <!-- Server-side error -->
    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/registration}"
          th:object="${user}"
          method="post"
          onsubmit="return validatePassword()">

        <!-- Email -->
        <label for="email">Email</label>

        <input type="email"
               id="email"
               th:field="*{email}"
               placeholder="Enter your email"
               required>

        <!-- Password -->
        <label for="password">Password</label>

        <input type="password"
               id="password"
               th:field="*{password}"
               placeholder="Enter your password"
               required>

        <!-- Confirm Password -->
        <label for="confirmPassword">
            Confirm Password
        </label>

        <input type="password"
               id="confirmPassword"
               placeholder="Confirm your password"
               required>

        <div id="passwordError"
             class="password-error">
        </div>

        <!-- Full Name -->
        <label for="fullName">Full Name</label>

        <input type="text"
               id="fullName"
               th:field="*{fullName}"
               placeholder="Enter your full name"
               required>

        <!-- Last Name -->
        <label for="lastName">Last Name</label>

        <input type="text"
               id="lastName"
               th:field="*{lastName}"
               placeholder="Enter your last name"
               required>

        <!-- Address -->
        <label for="address">Address</label>

        <textarea id="address"
                  th:field="*{address}"
                  placeholder="Enter your address"
                  required></textarea>

        <button type="submit">
            Sign Up
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a th:href="@{/login}">
            Login
        </a>
    </div>

</div>


<script>

    function validatePassword() {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const passwordError =
            document.getElementById("passwordError");


        if (password !== confirmPassword) {

            passwordError.innerText =
                "Password and Confirm Password do not match.";

            return false;
        }


        passwordError.innerText = "";

        return true;
    }

</script>

</body>

</html>
