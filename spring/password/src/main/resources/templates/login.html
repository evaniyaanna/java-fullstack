<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Login</h1>

    <!-- Registration success -->
    <div class="success"
         th:if="${param.registered}">
        Registration successful.
        Please login.
    </div>

    <!-- Logout message -->
    <div class="success"
         th:if="${param.logout}">
        You have been logged out successfully.
    </div>

    <!-- Login error -->
    <div class="error"
         th:if="${param.error}">
        Invalid email or password.
    </div>

    <form th:action="@{/login}"
          method="post">

        <label for="email">
            Email
        </label>

        <input type="email"
               id="email"
               name="username"
               placeholder="Enter your email"
               required>

        <label for="password">
            Password
        </label>

        <input type="password"
               id="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="register-link">

        Don't have an account?

        <a th:href="@{/registration}">
            Sign Up
        </a>

    </div>

</div>

</body>

</html>
