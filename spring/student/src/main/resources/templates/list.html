<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Student List</title>
</head>

<body>

<h1>Student List</h1>

<!-- Search -->
<form action="#" th:action="@{/all}" method="get">

    <input type="text"
           name="keyword"
           placeholder="Search student by name" />

    <input type="submit" value="Search" />

</form>

<br>

<a href="/create">Add New Student</a>

<br><br>

<table border="1">

    <thead>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Class</th>
        <th>Age</th>
        <th>Actions</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="student : ${students}">

        <td th:text="${student.id}"></td>

        <td th:text="${student.name}"></td>

        <td th:text="${student.studentClass}"></td>

        <td th:text="${student.age}"></td>

        <td>

            <a th:href="@{/update/{id}(id=${student.id})}">
                Edit
            </a>

            &nbsp;

            <a th:href="@{/delete/{id}(id=${student.id})}">
                Delete
            </a>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
