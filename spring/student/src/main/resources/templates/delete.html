<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Delete Student</title>
</head>

<body>

<h1>Delete Student</h1>

<p>
    Are you sure you want to delete
    <span th:text="${studentDetails.name}"></span>?
</p>

<form action="#"
      th:action="@{/delete/{id}(id=${studentDetails.id})}"
      method="post">

    <input type="submit" value="Delete" />

</form>

<br>

<a href="/all">Cancel</a>

</body>
</html>
