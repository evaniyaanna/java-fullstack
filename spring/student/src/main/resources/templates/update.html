<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Update Student</title>
</head>

<body>

<h1>Update Student</h1>

<form action="#"
      th:action="@{/update/{id}(id=${studentDetails.id})}"
      method="post">

    <label>Name:</label>

    <input type="text"
           name="name"
           th:value="${studentDetails.name}"
           required />

    <br><br>

    <label>Class:</label>

    <input type="text"
           name="studentClass"
           th:value="${studentDetails.studentClass}"
           required />

    <br><br>

    <label>Age:</label>

    <input type="number"
           name="age"
           th:value="${studentDetails.age}"
           required />

    <br><br>

    <input type="submit" value="Update Student" />

</form>

<br>

<a href="/all">Back to Student List</a>

</body>
</html>
