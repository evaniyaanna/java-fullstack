<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }


        .container {

            width: 400px;

            margin: 60px auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.1);
        }


        h2 {
            text-align: center;
            margin-bottom: 25px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 5px;

            box-sizing: border-box;
        }


        button {

            width: 100%;

            padding: 12px;

            background: #007bff;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;
        }


        button:hover {

            background: #0056b3;
        }


        .error {

            background: #f8d7da;

            color: #721c24;

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 5px;
        }


        .login-link {

            text-align: center;

            margin-top: 18px;
        }

    </style>

</head>


<body>


<div class="container">

    <h2>
        Create Account
    </h2>


    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>


    <form
        th:action="@{/registration}"
        th:object="${user}"
        method="post">


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                th:field="*{username}"
                placeholder="Enter username"
                required>

        </div>


        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="tel"
                th:field="*{phone}"
                placeholder="Enter phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required>

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                th:field="*{password}"
                placeholder="Enter password"
                minlength="6"
                required>

        </div>


        <button type="submit">
            Register
        </button>


    </form>


    <div class="login-link">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>


</div>


</body>

</html>
